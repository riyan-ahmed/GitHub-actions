---
name: GitHub Hosted Runners

"on":
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Print runner information
        run: |
          echo "OS: ${{ runner.os }}"
          hostname
          whoami

      - name: Check pre-installed tools
        run: |
          docker --version
          python --version
          node --version
          git --version

  windows:
    runs-on: windows-latest
    steps:
      - name: Print runner information
        run: |
          echo "OS: ${{ runner.os }}"
          hostname
          whoami

  macos:
    runs-on: macos-latest
    steps:
      - name: Print runner information
        run: |
          echo "OS: ${{ runner.os }}"
          hostname
          whoami
