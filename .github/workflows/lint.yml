#what is the goal of the workflow?
#whenever someone changes the python code linter will checkthe syntaxof the code.

name: Auto Linter


on:
    push:
        paths:  "*.py"

jobs:
    code:
         runs-on: ubuntu-latest
         steps:
         #this step will automatically clone the branch into the runner
         - name: Checkout/Clone the code
           uses: actions/checkout@v7
#this step will Install the linter tool
         - name: Install Linter
           run: pip install ruff

         - name: check files for linting
           run: ruff check .

         - name: Set up Python
           uses: actions/setup-python@v5
           with:
            python-version: '3.14' # Specify your exact Python version here
            cache: 'pip'          # Optional: turn on automatic caching for faster runs

